function prodM(id,bc){const p=id?S.products.find(x=>x.id===id):{barcode:bc||''},scanned=!id&&bc;modal(scanned?'Item Not Registered':id?'Edit product':'Register product',`${scanned?'<div class="notice">This barcode is not in the system. Enter its details once; future scans find it automatically.</div>':''}<div class="form-grid"><div class="field full"><label>Product name *</label><input class="input" id="n1" value="${esc(p.name)}"></div><div class="field full"><label>Barcode *</label><input class="input" id="b1" value="${esc(p.barcode)}"></div><div class="field"><label>Selling price (Rs.) *</label><input class="input" id="p1" type="number" min="0" step="0.01" value="${p.price??''}"></div>${id?'':'<div class="field"><label>Opening stock (blank = not tracked)</label><input class="input" id="s1" type="number" min="0" step="1"></div>'}</div>`,async()=>{
 const name=$('#n1').value.trim(),barcode=$('#b1').value.trim(),price=+$('#p1').value;if(!name||!barcode||$('#p1').value===''||!(price>=0))return toast('Name, barcode and a valid price are required');if(S.products.some(x=>x.barcode===barcode&&x.id!==id))return toast('That barcode is already registered');
 const st=id?p.stock:($('#s1').value===''?null:Math.floor(+$('#s1').value)),o={...p,id:p.id||uid(),name,barcode,price,stock:st??null},ops=[['products',o]];if(!id&&st)ops.push(['stock',{id:uid(),pid:o.id,delta:st,reason:'Opening stock',ts:Date.now()}]);await save(ops);closeM();if(scanned&&page==='checkout')addCart(o);else render()},scanned?'Save & add to cart':'Save')}
function adjM(id){const p=S.products.find(x=>x.id===id);modal('Stock · '+esc(p.name),`<p>Current: <b>${p.stock??'not tracked'}</b></p><div class="form-grid"><div class="field"><label>Change (+ restock, − remove)</label><input class="input" id="d1" type="number" step="1"></div><div class="field"><label>Reason</label><select id="r1"><option>Restock</option><option>Manual adjustment</option><option>Damaged / expired</option></select></div></div>`,async()=>{const d=Math.round(+$('#d1').value),ns=(p.stock||0)+d;if(!d)return toast('Enter a non-zero change');if(ns<0)return toast('Stock cannot go below zero');await save([['products',{...p,stock:ns}],['stock',{id:uid(),pid:id,delta:d,reason:$('#r1').value,ts:Date.now()}]]);closeM();render()})}
/* history */
function history(){shell('Transaction records','Sales history','Every purchase, including voided ones, with payments and balance.','','Receipt, customer, apartment, product or date (YYYY-MM-DD)',`<select style="max-width:170px" onchange="HF=this.value;fill()">${[['all','All transactions'],['pending','Unpaid'],['partial','Partially paid'],['overdue','Overdue'],['paid','Paid'],['void','Voided']].map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select>`);
 fill=()=>{const r=[...S.sales].sort((a,b)=>b.ts-a.ts).filter(s=>(HF==='all'||status(s)===HF)&&match([s.receipt,cname(s),cust(s.cid)?.phone,day(s.ts),dt(s.ts),...s.items.map(i=>i.name)].join(' '))).slice(0,300);$('#res').innerHTML=salesTable(r,1)};fill()}
function saleM(id){const s=S.sales.find(x=>x.id===id),c=cust(s.cid);modal('Receipt '+s.receipt,`<p class="hint">${esc(cname(s))}</p>${sb(s,0)}${c?`<button class="btn secondary" onclick="acct('${gk(c)}')">Open customer account & statements</button>`:''}`,null,'',1)}
/* printing */
const rcpt=s=>`<div class="th"><h2>${esc(SHOP())}</h2><p class="c">Receipt ${s.receipt}<br>${dt(s.ts)}${s.voided?'<br><b>*** VOIDED ***</b>':''}</p><div>Customer: ${esc(cname(s))}</div><hr>${s.items.map(i=>`<div>${esc(i.name)}</div><div class="rw"><span>${i.qty} x ${n(i.price)}</span><span>${n(i.qty*i.price)}</span></div>`).join('')}<hr><div class="rw"><b>TOTAL</b><b>${rs(s.total)}</b></div><div class="rw"><span>Paid</span><span>${rs(paid(s))}</span></div><div class="rw"><b>Balance due</b><b>${rs(bal(s))}</b></div><hr><p class="c">Thank you!</p></div>`;
function stmt(ids){const ss=ids.map(i=>S.sales.find(s=>s.id===i)).filter(s=>!s.voided).sort((a,b)=>(a.cid>b.cid?1:a.cid<b.cid?-1:0)||a.ts-b.ts);let tot=0,last='';const c0=cust(ss[0].cid);
 return`<div class="th"><h2>${esc(SHOP())}</h2><p class="c">ACCOUNT STATEMENT<br>${dt(Date.now())}</p>${c0.apt?`<div>Apartment: ${esc(c0.apt)}</div>`:''}<hr>${ss.map(s=>{const b=bal(s),c=cust(s.cid);tot+=b;let h='';if(s.cid!==last){last=s.cid;h=`<div><b>${esc(c.name)}</b></div>`}return`${h}<div style="margin-top:6px"><b>${s.receipt}</b> – ${dt(s.ts)}</div>${s.items.map(i=>`<div class="rw"><span>${i.qty} x ${esc(i.name)} @${n(i.price)}</span><span>${n(i.qty*i.price)}</span></div>`).join('')}<div class="rw"><b>Bill total</b><b>${rs(s.total)}</b></div>${S.payments.filter(p=>p.saleId===s.id&&!p.voided).sort((a,b)=>a.ts-b.ts).map(p=>`<div class="rw"><span>Paid ${day(p.ts)} ${esc(p.method)}</span><span>-${n(p.amount)}</span></div>`).join('')}<div class="rw"><b>Balance</b><b>${rs(b)}</b></div><hr>`}).join('')}<div class="rw"><b>TOTAL OUTSTANDING</b><b>${rs(tot)}</b></div><hr><p class="c">Statement only – no new charges.</p></div>`}

async function restore(f){if(!f)return;let j;try{j=JSON.parse(await f.text())}catch(e){return toast('Invalid file: not JSON')}const d=j&&j.app==='tuckpos'&&j.data,bad=m=>toast('Invalid backup: '+m);if(!d)return bad('not a Tuck Shop backup');
 for(const s of ST){if(!Array.isArray(d[s]))return bad('missing '+s);if(d[s].some(x=>!x||typeof x.id!=='string'))return bad('bad record in '+s);if(new Set(d[s].map(x=>x.id)).size!==d[s].length)return bad('duplicate ids in '+s)}
 const u=(a,k)=>new Set(a.map(x=>x[k])).size===a.length,sid=new Set(d.sales.map(s=>s.id));if(!u(d.sales,'receipt'))return bad('duplicate receipt numbers');if(!u(d.payments,'ref'))return bad('duplicate payment references');if(d.payments.some(p=>!sid.has(p.saleId)||!(p.amount>0)))return bad('payment without a valid sale');if(d.sales.some(s=>!Array.isArray(s.items)||typeof s.total!=='number'))return bad('malformed sales');
 modal('Replace all data?',`<div class="alert">This <b>erases everything currently stored</b> and replaces it with the backup (${d.sales.length} sales, ${d.customers.length} customers, ${d.products.length} products, ${d.payments.length} payments).</div>`,async()=>{await tx(ST,t=>ST.forEach(s=>{const o=t.objectStore(s);o.clear();d[s].forEach(x=>o.put(x))}));await load();closeM();render();toast('Backup restored')},'Replace data')}
